# Without this, Compose names the project after the file's directory ("docker"),
# not this repo. tests/e2e/compose_smoke.sh passes -p obs-compose-e2e explicitly,
# which outranks this and keeps its isolated project unaffected.
name: observability-platform

services:
  backend:
    restart: unless-stopped
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: backend
    # Loopback only, on purpose. A bare "8080:8080" publishes on 0.0.0.0, which
    # puts this unauthenticated backend on every network the host can route to.
    # Nothing in this repository needs the demo reachable off-host: Grafana,
    # Prometheus and the two producers reach the backend as `backend:8080` over
    # the Compose network, which host publishing does not affect at all, and
    # every runbook, Make target and smoke script uses localhost.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OBS_DATA_DIR: /data
      OBS_LOG_LEVEL: info
      # Demo-only: the 8 MiB default means the head buffer never flushes at demo
      # volume (~506 B/s), so every Grafana query would be served from memory and
      # the Phase 4.3 chunk/index path would never run. 16 KiB flushes every ~32s.
      OBS_LOGS_FLUSH_THRESHOLD_BYTES: "16384"
    volumes:
      - obs-data:/data
    # The runtime image is distroless — no shell, no curl, no wget — so the probe
    # is the server binary itself. /readyz also proves the data directory is
    # writable, not just that the port is open.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.53.0
    # Loopback only; see the backend service above. This Prometheus has no
    # authentication and no access control of any kind.
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Demo telemetry, not an archive. A day is enough to show a trend and keeps
      # the volume small enough that `make local-reset` stays fast.
      - --storage.tsdb.retention.time=24h
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - obs-prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    # Unlike the distroless backend image, prom/prometheus ships busybox, so wget
    # is available for the probe.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.1.0
    # Loopback only; see the backend service above. This one matters most: the
    # demo password below is `admin`.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - obs-grafana-data:/var/lib/grafana
      - ../../observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards

  load-generator:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: loadgen
    environment:
      OBS_BACKEND_ADDR: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  sample-app:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: sampleapp
    environment:
      OBS_BACKEND_ADDR: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  obs-data:
  obs-grafana-data:
  obs-prometheus-data:
