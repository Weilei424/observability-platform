name: observability-platform

services:
  backend:
    restart: unless-stopped
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: backend
    ports:
      - "8080:8080"
    environment:
      OBS_DATA_DIR: /data
      OBS_LOG_LEVEL: info
      # Demo-only: the 8 MiB default means the head buffer never flushes at demo
      # volume (~506 B/s), so every Grafana query would be served from memory and
      # the Phase 4.3 chunk/index path would never run. 16 KiB flushes every ~32s.
      OBS_LOGS_FLUSH_THRESHOLD_BYTES: "16384"
    volumes:
      - obs-data:/data
    # The runtime image is distroless — no shell, no curl, no wget — so the probe
    # is the server binary itself. /readyz also proves the data directory is
    # writable, not just that the port is open.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - obs-grafana-data:/var/lib/grafana
      - ../../observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards

  load-generator:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: loadgen
    environment:
      OBS_BACKEND_ADDR: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  sample-app:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: sampleapp
    environment:
      OBS_BACKEND_ADDR: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  obs-data:
  obs-grafana-data:
