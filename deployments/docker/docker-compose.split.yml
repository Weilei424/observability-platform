# The split topology: the five components as separate containers (three
# ingesters behind a ring, four stores behind a store ring), with Grafana,
# Prometheus, and both producers exactly as in docker-compose.yml. The gateway
# answers as `backend` on the Compose network, so every datasource, producer, and
# runbook URL that names the backend reaches it unchanged — Grafana cannot tell
# the difference, which tests/e2e/compose_smoke.sh checks.
#
# Every durable directory has one owner: each ingester keeps its own WALs, each
# store keeps the blocks and log chunks of the keys it owns. No volume is shared
# between components.
#
# The components have no depends_on between one another, on purpose: each must
# start with its peers down (tests/e2e/compose_split_test.go pins that).
name: observability-platform-split

# The ring settings the gateway and querier must share: the gateway writes where
# the querier reads (spec §7), so the member list, replication factor and
# per-ingester timeout live in one place and cannot drift. RF=3 on three
# ingesters puts every key on every ingester; quorum is 2, so one ingester down
# is survivable and two down is not.
x-ring-env: &ring-env
  OBS_INGESTER_URL: http://ingester-1:8080,http://ingester-2:8080,http://ingester-3:8080
  OBS_REPLICATION_FACTOR: "3"
  OBS_INGESTER_TIMEOUT: "10s"

# The store ring the ingesters flush to and the querier reads from: both must
# place a key on the same stores (spec §9.1), so the list and the store
# replication factor live in one place. R_s=3 on four stores: a flush needs a
# per-key quorum of 2, so one store down is survivable and two down is not. The
# compactor takes the list alone (it walks each store on its own and refuses
# OBS_STORE_REPLICATION_FACTOR).
x-store-ring-env: &store-ring-env
  OBS_STORE_URL: http://store-1:8080,http://store-2:8080,http://store-3:8080,http://store-4:8080
  OBS_STORE_REPLICATION_FACTOR: "3"

x-ingester: &ingester
  restart: unless-stopped
  # Docker's default stop_grace_period is 10s: SIGTERM, then SIGKILL if the
  # container hasn't exited by then. The ingester's graceful stop is bounded by
  # its 50s shutdown budget: a 10s HTTP drain, then a drain of its whole head
  # into the store. Against a slow or loaded store the default grace period can
  # SIGKILL it mid-flush; 60s covers the budget with margin.
  stop_grace_period: 60s
  build:
    context: ../../
    dockerfile: deployments/docker/Dockerfile
    target: backend
  healthcheck:
    test: ["CMD", "/server", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

x-store: &store
  restart: unless-stopped
  # Matches the ingester's stop_grace_period: a store stop mid-flush (an
  # ingester still delivering its 30s-timeout flush request) should finish
  # that request rather than be SIGKILLed by Docker's 10s default.
  stop_grace_period: 60s
  build:
    context: ../../
    dockerfile: deployments/docker/Dockerfile
    target: backend
  healthcheck:
    test: ["CMD", "/server", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  gateway:
    restart: unless-stopped
    # Docker's default 10s grace is shorter than the gateway's stop: up to 10s
    # of HTTP drain, then background replica pushes already running, each
    # bounded by OBS_INGESTER_TIMEOUT (10s). Kubernetes' default 30s covers it.
    stop_grace_period: 30s
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: backend
    environment:
      OBS_TARGET: gateway
      OBS_LOG_LEVEL: info
      <<: *ring-env
      OBS_QUERIER_URL: http://querier:8080
      OBS_TENANT_OVERRIDES_FILE: /etc/obs/tenant-overrides.yaml
    # Loopback only, as in docker-compose.yml. The gateway is the only component
    # published at all: the internal API on every other one stays on the
    # Compose network.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./tenant-overrides.yaml:/etc/obs/tenant-overrides.yaml:ro
    networks:
      default:
        aliases: [backend]
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  ingester-1:
    <<: *ingester
    environment: &ingester-env
      OBS_TARGET: ingester
      OBS_DATA_DIR: /data
      OBS_LOG_LEVEL: info
      <<: *store-ring-env
      # Demo-only, as in docker-compose.yml: at demo volume the 8 MiB default
      # would never flush, and the store's chunk path would never run.
      OBS_LOGS_FLUSH_THRESHOLD_BYTES: "16384"
      # Each ingester's own URL as OBS_INGESTER_URL lists it: it refuses a
      # request meant for another member, which a connection held across a
      # restart that reshuffled container addresses could otherwise deliver.
      OBS_INGESTER_SELF_URL: http://ingester-1:8080
      # Phase 6.5: an ingester enforces its share of each tenant's limit,
      # ceil(limit x RF / N), so it must know the gateway's RF and member list;
      # without them it would enforce the full limit. Pinned equal to the
      # gateway's by tests/e2e/compose_tenant_test.go.
      OBS_INGESTER_URL: http://ingester-1:8080,http://ingester-2:8080,http://ingester-3:8080
      OBS_REPLICATION_FACTOR: "3"
      OBS_TENANT_OVERRIDES_FILE: /etc/obs/tenant-overrides.yaml
    volumes:
      - obs-ingester-1-data:/data
      - ./tenant-overrides.yaml:/etc/obs/tenant-overrides.yaml:ro

  ingester-2:
    <<: *ingester
    environment:
      <<: *ingester-env
      OBS_INGESTER_SELF_URL: http://ingester-2:8080
    volumes:
      - obs-ingester-2-data:/data
      - ./tenant-overrides.yaml:/etc/obs/tenant-overrides.yaml:ro

  ingester-3:
    <<: *ingester
    environment:
      <<: *ingester-env
      OBS_INGESTER_SELF_URL: http://ingester-3:8080
    volumes:
      - obs-ingester-3-data:/data
      - ./tenant-overrides.yaml:/etc/obs/tenant-overrides.yaml:ro

  querier:
    restart: unless-stopped
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: backend
    environment:
      OBS_TARGET: querier
      OBS_LOG_LEVEL: info
      <<: [*ring-env, *store-ring-env]
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  store-1:
    <<: *store
    environment: &store-env
      OBS_TARGET: store
      OBS_DATA_DIR: /data
      OBS_LOG_LEVEL: info
      # Each store's own URL as OBS_STORE_URL lists it: it answers 421 to a
      # request routed for another store, so a reshuffled container address
      # cannot land a key's copy on a store that does not own it.
      OBS_STORE_SELF_URL: http://store-1:8080
    volumes:
      - obs-store-1-data:/data

  store-2:
    <<: *store
    environment:
      <<: *store-env
      OBS_STORE_SELF_URL: http://store-2:8080
    volumes:
      - obs-store-2-data:/data

  store-3:
    <<: *store
    environment:
      <<: *store-env
      OBS_STORE_SELF_URL: http://store-3:8080
    volumes:
      - obs-store-3-data:/data

  store-4:
    <<: *store
    environment:
      <<: *store-env
      OBS_STORE_SELF_URL: http://store-4:8080
    volumes:
      - obs-store-4-data:/data

  compactor:
    restart: unless-stopped
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: backend
    environment:
      OBS_TARGET: compactor
      OBS_LOG_LEVEL: info
      OBS_STORE_URL: http://store-1:8080,http://store-2:8080,http://store-3:8080,http://store-4:8080
      OBS_TENANT_OVERRIDES_FILE: /etc/obs/tenant-overrides.yaml
    volumes:
      - ./tenant-overrides.yaml:/etc/obs/tenant-overrides.yaml:ro
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ../../observability/prometheus/prometheus.split.yml:/etc/prometheus/prometheus.yml:ro
      - obs-prometheus-data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - obs-grafana-data:/var/lib/grafana
      - ../../observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards

  # The producers wait for the gateway and every ingester: a write needs the gateway and every ingester it may route to.
  load-generator:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: loadgen
    environment:
      OBS_BACKEND_ADDR: http://backend:8080
    depends_on:
      gateway:
        condition: service_healthy
      ingester-1:
        condition: service_healthy
      ingester-2:
        condition: service_healthy
      ingester-3:
        condition: service_healthy
    restart: on-failure

  sample-app:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      target: sampleapp
    environment:
      OBS_BACKEND_ADDR: http://backend:8080
    depends_on:
      gateway:
        condition: service_healthy
      ingester-1:
        condition: service_healthy
      ingester-2:
        condition: service_healthy
      ingester-3:
        condition: service_healthy
    restart: on-failure

volumes:
  obs-ingester-1-data:
  obs-ingester-2-data:
  obs-ingester-3-data:
  obs-store-1-data:
  obs-store-2-data:
  obs-store-3-data:
  obs-store-4-data:
  obs-grafana-data:
  obs-prometheus-data:
