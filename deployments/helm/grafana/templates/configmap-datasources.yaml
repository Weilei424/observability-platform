apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.name" . }}-datasources
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  # Templated rather than copied from observability/grafana/datasources/: the
  # backend URL is the one part of Grafana provisioning that differs between
  # Compose and Kubernetes. The uids are NOT free to change — the provisioned
  # dashboards reference obs-prometheus and obs-loki by uid.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: observability-platform
        type: prometheus
        uid: obs-prometheus
        access: proxy
        url: {{ .Values.backend.url }}
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "5s"
      - name: observability-platform-logs
        type: loki
        uid: obs-loki
        access: proxy
        url: {{ .Values.backend.url }}
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
