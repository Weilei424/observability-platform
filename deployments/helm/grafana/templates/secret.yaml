{{- if not .Values.admin.existingSecret }}
{{- if not .Values.admin.password }}
{{- fail "grafana: set admin.password, or admin.existingSecret naming a Secret with an admin-password key. This chart ships no default password on purpose — see values.yaml." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana.name" . }}-admin
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.admin.password | quote }}
{{- end }}
