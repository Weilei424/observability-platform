{{- if eq .Values.topology "split" }}
{{- if lt (int .Values.split.ingester.replicas) 1 }}
{{- fail "split.ingester.replicas must be at least 1" }}
{{- end }}
{{- $writeCount := int (include "backend.ingesterWriteCount" .) }}
{{- if or (lt $writeCount 1) (gt $writeCount (int .Values.split.ingester.replicas)) }}
{{- fail (printf "split.ingester.writeReplicas must be between 1 and split.ingester.replicas (%d), got %d: the gateway may only write to ingesters the querier reads" (int .Values.split.ingester.replicas) $writeCount) }}
{{- end }}
{{- if or (lt (int .Values.split.replicationFactor) 1) (gt (int .Values.split.replicationFactor) $writeCount) }}
{{- fail (printf "split.replicationFactor (%d) must be at least 1 and must not exceed the ingesters the gateway writes to (%d): every write needs that many distinct replicas" (int .Values.split.replicationFactor) $writeCount) }}
{{- end }}
{{- $qRF := int (include "backend.querierReplicationFactor" .) }}
{{- if or (lt $qRF 1) (gt $qRF (int .Values.split.ingester.replicas)) }}
{{- fail (printf "split.querier.replicationFactor (%d) must be at least 1 and must not exceed the ingesters the querier reads (split.ingester.replicas, %d)" $qRF (int .Values.split.ingester.replicas)) }}
{{- end }}
{{- $gwQuorum := int (include "backend.quorum" (int .Values.split.replicationFactor)) }}
{{- $qQuorum := int (include "backend.quorum" $qRF) }}
{{- if gt $qQuorum $gwQuorum }}
{{- fail (printf "the querier's quorum %d (split.querier.replicationFactor=%d) exceeds the gateway's quorum %d (split.replicationFactor=%d): a read would skip more ingesters than a write's acknowledgements cover. Raise an RF gateway first and the querier after the ingesters' heads flush; lower it querier first, then the gateway" $qQuorum $qRF $gwQuorum (int .Values.split.replicationFactor)) }}
{{- end }}
{{- /* The ring staging check (backend.ringStagingCheck) over the live objects. */}}
{{- $gwName := include "backend.componentName" (list . "gateway") }}
{{- $qName := include "backend.componentName" (list . "querier") }}
{{- $live := dict
  "gateway" (lookup "apps/v1" "Deployment" .Release.Namespace $gwName)
  "querier" (lookup "apps/v1" "Deployment" .Release.Namespace $qName)
  "gatewayConfig" (lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-config" $gwName))
  "querierConfig" (lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-config" $qName)) }}
{{- include "backend.ringStagingCheck" (list . $live) }}
{{- if gt (int .Values.split.store.replicas) 1 }}
{{- fail "split.store.replicas must be 1 until Phase 6.4: a second store would hold blocks no querier reads" }}
{{- end }}
{{- if gt (int .Values.split.compactor.replicas) 1 }}
{{- fail "split.compactor.replicas must be 1: two compactors would plan and run the same compactions" }}
{{- end }}
{{- $root := . }}
{{- range $component := list "gateway" "ingester" "querier" "store" "compactor" }}
---
{{ include "backend.splitConfigMap" (list $root $component) }}
{{- end }}
{{- end }}
