{{- if eq .Values.topology "split" }}
{{- if lt (int .Values.split.ingester.replicas) 1 }}
{{- fail "split.ingester.replicas must be at least 1" }}
{{- end }}
{{- if gt (int .Values.split.store.replicas) 1 }}
{{- fail "split.store.replicas must be 1 until Phase 6.4: a second store would hold blocks no querier reads" }}
{{- end }}
{{- if gt (int .Values.split.compactor.replicas) 1 }}
{{- fail "split.compactor.replicas must be 1: two compactors would plan and run the same compactions" }}
{{- end }}
{{- $root := . }}
{{- $peers := dict "gateway" (list "ingester" "querier") "ingester" (list "store") "querier" (list "ingester" "store") "store" (list) "compactor" (list "store") }}
{{- range $component := list "gateway" "ingester" "querier" "store" "compactor" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.componentName" (list $root $component) }}-config
  labels:
    {{- include "backend.componentLabels" (list $root $component) | nindent 4 }}
data:
  # The chart owns the target and the peer URLs (config.OBS_* refuses them),
  # rendering each peer from the Service that component's objects create.
  OBS_TARGET: {{ $component | quote }}
  OBS_HTTP_ADDR: {{ printf ":%d" ($root.Values.service.port | int) | quote }}
  {{- range $peer := index $peers $component }}
  {{- if eq $peer "ingester" }}
  OBS_INGESTER_URL: {{ include "backend.ingesterURLs" $root | quote }}
  {{- else }}
  OBS_{{ upper $peer }}_URL: {{ include "backend.peerURL" (list $root $peer) | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := $root.Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
