{{- if eq .Values.topology "split" }}
{{- if lt (int .Values.split.ingester.replicas) 1 }}
{{- fail "split.ingester.replicas must be at least 1" }}
{{- end }}
{{- $writeCount := int (include "backend.ingesterWriteCount" .) }}
{{- if or (lt $writeCount 1) (gt $writeCount (int .Values.split.ingester.replicas)) }}
{{- fail (printf "split.ingester.writeReplicas must be between 1 and split.ingester.replicas (%d), got %d: the gateway may only write to ingesters the querier reads" (int .Values.split.ingester.replicas) $writeCount) }}
{{- end }}
{{- /*
The gateway and querier roll independently, so an old pod of one runs beside a
new pod of the other. Stay safe across that overlap: a new gateway may write
only to ingesters the old querier reads, and a new querier must still read
every ingester the old gateway writes to. The previous counts come from the
live ConfigMaps; split.ingester.previous stands in for them in a preview.
*/}}
{{- $prev := dict }}
{{- with .Values.split.ingester.previous }}
{{- $prev = dict "replicas" (int .replicas) "writeReplicas" (int .writeReplicas) }}
{{- else }}
{{- $gw := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-config" (include "backend.componentName" (list . "gateway"))) }}
{{- $q := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-config" (include "backend.componentName" (list . "querier"))) }}
{{- if and $gw $q $gw.data $q.data $gw.data.OBS_INGESTER_URL $q.data.OBS_INGESTER_URL }}
{{- $prev = dict "replicas" (len (splitList "," $q.data.OBS_INGESTER_URL)) "writeReplicas" (len (splitList "," $gw.data.OBS_INGESTER_URL)) }}
{{- end }}
{{- end }}
{{- if $prev }}
{{- if gt $writeCount (int $prev.replicas) }}
{{- fail (printf "unstaged ring change: the gateway would write to %d ingesters while the running querier reads only %d. Add an ingester in two upgrades: first split.ingester.replicas=%d with split.ingester.writeReplicas=%d, then raise writeReplicas" $writeCount (int $prev.replicas) (int .Values.split.ingester.replicas) (int $prev.replicas)) }}
{{- end }}
{{- if lt (int .Values.split.ingester.replicas) (int $prev.writeReplicas) }}
{{- fail (printf "unstaged ring change: the querier would read %d ingesters while the running gateway writes to %d. Remove an ingester in stages: first lower split.ingester.writeReplicas to %d, drain the ingester (POST /internal/v1/drain answers 200) and scale it down, then lower replicas" (int .Values.split.ingester.replicas) (int $prev.writeReplicas) (int .Values.split.ingester.replicas)) }}
{{- end }}
{{- end }}
{{- if gt (int .Values.split.store.replicas) 1 }}
{{- fail "split.store.replicas must be 1 until Phase 6.4: a second store would hold blocks no querier reads" }}
{{- end }}
{{- if gt (int .Values.split.compactor.replicas) 1 }}
{{- fail "split.compactor.replicas must be 1: two compactors would plan and run the same compactions" }}
{{- end }}
{{- $root := . }}
{{- $peers := dict "gateway" (list "ingester" "querier") "ingester" (list "store") "querier" (list "ingester" "store") "store" (list) "compactor" (list "store") }}
{{- range $component := list "gateway" "ingester" "querier" "store" "compactor" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.componentName" (list $root $component) }}-config
  labels:
    {{- include "backend.componentLabels" (list $root $component) | nindent 4 }}
data:
  # The chart owns the target and the peer URLs (config.OBS_* refuses them),
  # rendering each peer from the Service that component's objects create.
  OBS_TARGET: {{ $component | quote }}
  OBS_HTTP_ADDR: {{ printf ":%d" ($root.Values.service.port | int) | quote }}
  {{- range $peer := index $peers $component }}
  {{- if and (eq $peer "ingester") (eq $component "gateway") }}
  OBS_INGESTER_URL: {{ include "backend.ingesterURLs" (list $root (include "backend.ingesterWriteCount" $root)) | quote }}
  {{- else if eq $peer "ingester" }}
  OBS_INGESTER_URL: {{ include "backend.ingesterURLs" (list $root $root.Values.split.ingester.replicas) | quote }}
  {{- else }}
  OBS_{{ upper $peer }}_URL: {{ include "backend.peerURL" (list $root $peer) | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := $root.Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
