# The Service name is pinned rather than derived from the release name, because
# the grafana and producers charts default their backend.url to this exact
# literal. Changing it here means changing it in both of those charts too;
# tests/e2e/helm_test.go fails if they disagree.
fullnameOverride: observability-backend

image:
  repository: observability-platform/backend
  tag: dev
  # IfNotPresent so a locally built image loaded with `kind load docker-image`
  # is used as-is. Always would make the kubelet try to pull from a registry
  # that does not have it, and the pod would sit in ImagePullBackOff.
  pullPolicy: IfNotPresent

service:
  port: 8080

persistence:
  size: 2Gi
  # Empty means the cluster default StorageClass. kind provides local-path.
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Every key below must be one viper actually reads; it silently ignores unknown
# OBS_* variables, so a typo here would be invisible at runtime rather than an
# error. tests/e2e/helm_test.go cross-references these against
# internal/config/config.go.
config:
  OBS_DATA_DIR: /data
  OBS_LOG_LEVEL: info
  OBS_RETENTION: 0s

# Startup probe budget: failureThreshold * periodSeconds is how long WAL replay
# is allowed to take before the pod is killed. 30 * 5s = 150s.
startupProbe:
  periodSeconds: 5
  failureThreshold: 30

# all-in-one runs the whole backend as one StatefulSet — the default, as before.
# split runs the five components of Phase 6.1. The gateway takes this chart's
# Service name, so the grafana, producers, and prometheus charts need no change
# beyond the prometheus chart's own topology switch.
topology: all-in-one

# Settings for topology: split; ignored in all-in-one. The ingester runs
# `split.ingester.replicas` pods behind a ring (Phase 6.2); the store runs
# `split.store.replicas` pods, each block on storeReplicationFactor of them
# (Phase 6.4); the compactor is a singleton and the chart refuses more than one.
# Their PVCs use persistence.storageClassName above.
split:
  # How many distinct ingesters every write goes to (the gateway) and how many
  # copies a read dedups (the querier). Must not exceed the ingesters the
  # gateway writes to (ingester.writeReplicas, else ingester.replicas); the
  # chart refuses it otherwise. Changing it rolls the gateway and the querier;
  # stage a change with querier.replicationFactor below, as the chart requires.
  replicationFactor: 3
  # How many distinct stores every flushed block goes to (the ingesters) and how
  # many copies a read dedups (the querier); the compactor never takes it. Must
  # not exceed the stores the ingesters flush to (store.writeReplicas, else
  # store.replicas); the chart refuses it otherwise. config.OBS_STORE_REPLICATION_FACTOR
  # is refused.
  storeReplicationFactor: 3
  gateway:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  querier:
    replicas: 1
    # Unset, the querier runs split.replicationFactor. Set it only to stage an
    # RF change, so the querier's quorum never exceeds the gateway's: raising,
    # set the new split.replicationFactor with this at the old value, then
    # remove it (--set split.querier.replicationFactor=null) once every
    # ingester has been drained (POST /internal/v1/drain answers 200) and
    # restarted, one at a time; lowering, set this to the new value first,
    # then lower split.replicationFactor and remove it.
    # replicationFactor: 3
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 512Mi }
  compactor:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  ingester:
    replicas: 3
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
  store:
    # Store pods; the querier and compactor read every one, each pod knows its
    # own URL (OBS_STORE_SELF_URL, from its pod name).
    replicas: 4
    # Unset, the ingesters flush to every store. Set it only to stage a store
    # change: adding, raise replicas first and writeReplicas after; removing,
    # lower writeReplicas first, hand off the leaving store (runbook), then
    # lower replicas. On an upgrade the chart refuses replicas below the stores
    # the running ingesters flush to.
    # writeReplicas: 4
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }

# Phase 6.5 multi-tenancy. Each setting is rendered onto exactly the targets
# that accept it (any other target refuses it at startup), so the matching
# config.OBS_* keys are refused. Tenants are named by the X-Scope-OrgID header.
tenants:
  # Refuse requests without a tenant header (all-in-one, gateway, querier).
  required: false
  # Per-tenant overrides, keyed by tenant id; a non-empty map renders a
  # ConfigMap mounted at /etc/obs/tenant-overrides.yaml on the all-in-one
  # backend, gateway, ingesters and compactor. Keys per tenant: retention,
  # max_active_series, max_active_streams, max_metrics_push_bytes,
  # max_logs_push_bytes. Example:
  #   overrides:
  #     team-b: {retention: 24h, max_active_series: 200, max_active_streams: 20}
  # In split mode each ingester enforces its share, ceil(limit x RF / N).
  overrides: {}
  # Cluster-wide defaults a tenant without an override gets; 0 is unlimited
  # (all-in-one and ingesters).
  maxActiveSeriesPerTenant: 0
  maxActiveStreamsPerTenant: 0
  # Largest accepted push body, 1 to 16777216 bytes (all-in-one and gateway).
  maxMetricsPushBytes: 1048576
  maxLogsPushBytes: 4194304
