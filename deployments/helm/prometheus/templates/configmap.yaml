apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.name" . }}-config
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  # Templated rather than copied from observability/prometheus/prometheus.yml:
  # the backend target is the one part that differs between Compose and Kubernetes.
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      scrape_timeout: 10s
    scrape_configs:
      - job_name: observability-platform-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ trimPrefix "http://" .Values.backend.url }}"]
            labels:
              service: observability-platform
