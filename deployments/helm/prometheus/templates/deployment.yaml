apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus.name" . }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the scrape config changes. Without this, a helm
        # upgrade rewrites the ConfigMap and the running Prometheus keeps the old
        # config until something unrelated restarts it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.retention }}
          ports:
            - name: http
              containerPort: 9090
          # httpGet, not exec: Phase 5.2 records that correction for the backend
          # chart, and a probe that shells out is both slower and one more thing
          # that can be missing from an image.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "prometheus.name" . }}-config
        # emptyDir, not a PVC: see the comment on retention in values.yaml.
        - name: data
          emptyDir: {}
