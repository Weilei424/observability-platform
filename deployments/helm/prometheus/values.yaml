fullnameOverride: observability-prometheus

image:
  repository: prom/prometheus
  tag: "v2.53.0"
  pullPolicy: IfNotPresent

service:
  port: 9090

backend:
  # The scrape target. This is a claim about a Service the BACKEND chart owns —
  # Helm cannot check it across charts. tests/e2e/helm_test.go renders both and
  # fails if this URL does not resolve to a Service the backend chart creates.
  url: http://observability-backend:8080

# Match the backend chart's topology. all-in-one scrapes backend.url; split
# scrapes every component below, each labelled with its component, which the
# internals dashboard reads to count requests once and to show which process is
# down. Each URL is a claim about a Service the backend chart creates in split;
# tests/e2e/helm_split_prometheus_test.go checks every one.
topology: all-in-one

split:
  targets:
    gateway: http://observability-backend:8080
    # One URL per ingester pod; keep it in step with the backend chart's split.ingester.replicas.
    ingester:
      - http://observability-ingester-0.observability-ingester-headless:8080
      - http://observability-ingester-1.observability-ingester-headless:8080
      - http://observability-ingester-2.observability-ingester-headless:8080
    querier: http://observability-querier:8080
    store: http://observability-store:8080
    compactor: http://observability-compactor:8080

scrapeInterval: 15s

# Demo telemetry on an emptyDir, deliberately: this chart is here so the
# self-observability dashboard works in the Kubernetes demo, not to ship a
# production Prometheus. Metrics are lost when the pod is rescheduled. If you
# want them kept, run a real Prometheus (kube-prometheus-stack) and point it at
# the backend's /metrics — the endpoint is the same.
retention: 24h

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
