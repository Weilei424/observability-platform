apiVersion: 1

# The second demo tenant (Phase 6.5): the same backend, reading as team-b.
datasources:
  - name: observability-platform (team-b)
    type: prometheus
    uid: obs-prometheus-team-b
    access: proxy
    url: http://backend:8080
    isDefault: false
    editable: false
    jsonData:
      timeInterval: "5s"
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: team-b
  - name: observability-platform-logs (team-b)
    type: loki
    uid: obs-loki-team-b
    access: proxy
    url: http://backend:8080
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: team-b
